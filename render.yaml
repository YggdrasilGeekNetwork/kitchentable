databases:
  - name: kitchentable-db
    databaseName: kitchentable
    plan: free
    postgresMajorVersion: "16"

services:
  - type: redis
    name: kitchentable-redis
    plan: free
    ipAllowList: []

  - type: web
    name: kitchentable-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kitchentable-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kitchentable-redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ENABLE_AV
        value: "false"
      - key: ENABLE_OVERLAY
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"

  - type: worker
    name: kitchentable-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bin/jobs
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kitchentable-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kitchentable-redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: kitchentable-web
          envVarKey: SECRET_KEY_BASE
      - key: ENABLE_AV
        value: "false"
      - key: ENABLE_OVERLAY
        value: "false"
